<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Form</title>
    <link
        href="index.css"
        rel="stylesheet"
      />
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
  <script src="index.js" defer></script>

</head>

<body>

  <div class="container">

    <h2>Employee Form</h2>

    <form id="employeeForm">

      <!-- Employee ID -->
      <div class="form-group">
        <label for="empId">Employee ID</label>
        <input
          type="number"
          id="empId"
          autofocus
          
        />
      </div>

      <!-- Employee Name -->
      <div class="form-group">
        <label for="empName">Employee Name</label>
        <input
          type="text"
          id="empName"
          disabled
        />
      </div>

      <!-- Salary -->
      <div class="form-group">
        <label for="salary">Salary</label>
        <input
          type="number"
          id="salary"
          disabled
        />
      </div>

      <!-- HRA -->
      <div class="form-group">
        <label for="hra">HRA</label>
        <input
          type="number"
          id="hra"
          disabled
        />
      </div>

      <!-- DA -->
      <div class="form-group">
        <label for="da">DA</label>
        <input
          type="number"
          id="da"
          disabled
        />
      </div>

      <!-- Deduction -->
      <div class="form-group">
        <label for="deduction">Deduction</label>
        <input
          type="number"
          id="deduction"
          disabled
        />
      </div>

      <!-- Buttons -->
      <div class="buttons">

        <button
          type="button"
          id="saveBtn"
          disabled
        >
          Save
        </button>

        <button
          type="button"
          id="changeBtn"
          disabled
        >
          Change
        </button>

        <button
          type="reset"
          id="resetBtn"
          disabled
        >
          Reset
        </button>

      </div>

    </form>

  </div>

</body>
</html>
